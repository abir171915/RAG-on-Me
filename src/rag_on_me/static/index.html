<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Abir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --border: #e3e7ec;
      --accent: #2f6fed;
      --accent-soft: #e8effd;
      --error: #c23b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1216;
        --surface: #171b21;
        --text: #e6e9ee;
        --muted: #9aa5b4;
        --border: #262c35;
        --accent: #6c9cff;
        --accent-soft: #1c2638;
        --error: #ff7b7b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1.55;
    }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 140px; }

    header h1 { margin: 0 0 6px; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); }

    .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 8px; }
    .examples button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .examples button:hover { border-color: var(--accent); color: var(--accent); }

    #thread { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
    .question { align-self: flex-end; max-width: 85%; background: var(--accent); color: #fff;
                padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
    .answer { background: var(--surface); border: 1px solid var(--border);
              padding: 14px 18px; border-radius: 14px 14px 14px 4px; overflow-x: auto; }
    .answer p:first-child { margin-top: 0; }
    .answer p:last-child { margin-bottom: 0; }
    .answer table { border-collapse: collapse; font-size: 0.9rem; }
    .answer th, .answer td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .answer.error { color: var(--error); }

    .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
               padding-top: 10px; border-top: 1px solid var(--border); }
    .sources span { font-size: 0.75rem; background: var(--accent-soft); color: var(--accent);
                    padding: 3px 8px; border-radius: 6px; }

    .thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border);
               border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    form {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: linear-gradient(transparent, var(--bg) 30%);
      padding: 24px 16px;
    }
    .bar { max-width: 760px; margin: 0 auto; display: flex; gap: 8px;
           background: var(--surface); border: 1px solid var(--border);
           border-radius: 14px; padding: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .bar input { flex: 1; border: 0; background: transparent; color: var(--text);
                 font: inherit; padding: 8px 10px; outline: none; min-width: 0; }
    .bar button { border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 500;
                  padding: 8px 18px; border-radius: 10px; cursor: pointer; }
    .bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ask Abir</h1>
      <p>Questions about my projects, research and experience, answered from my CV, papers and GitHub.</p>
    </header>

    <div class="examples">
      <button type="button">What deep learning projects has Abir built?</button>
      <button type="button">What is the SlotFinder system?</button>
      <button type="button">Has Abir deployed models with FastAPI or Docker?</button>
      <button type="button">What was the MSc thesis about?</button>
    </div>

    <div id="thread"></div>
  </main>

  <form id="ask-form">
    <div class="bar">
      <input id="question" type="text" placeholder="Ask a question…" autocomplete="off" minlength="3" maxlength="500" required>
      <button id="send" type="submit">Ask</button>
    </div>
  </form>

  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const send = document.getElementById("send");
    const thread = document.getElementById("thread");

    function addBubble(className, html) {
      const el = document.createElement("div");
      el.className = className;
      el.innerHTML = html;
      thread.appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });
      return el;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function ask(question) {
      addBubble("question", escapeHtml(question));
      const answer = addBubble("answer", '<div class="thinking"><div class="spinner"></div>Searching my documents…</div>');
      send.disabled = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) throw new Error(res.status === 422 ? "Please ask a question of 3–500 characters." : "Something went wrong. Please try again.");

        const data = await res.json();
        const sources = data.sources.map(s => `<span>${escapeHtml(s)}</span>`).join("");
        answer.innerHTML = DOMPurify.sanitize(marked.parse(data.answer)) +
                           (sources ? `<div class="sources">${sources}</div>` : "");
      } catch (err) {
        answer.classList.add("error");
        answer.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (question.length < 3 || send.disabled) return;
      input.value = "";
      ask(question);
    });

    document.querySelectorAll(".examples button").forEach(btn =>
      btn.addEventListener("click", () => { if (!send.disabled) ask(btn.textContent); })
    );
  </script>
</body>
</html>
